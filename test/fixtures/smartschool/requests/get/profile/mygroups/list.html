<!DOCTYPE html>
<!-- Hand-written (#251) in the shape of Smartschool's list of own mail groups
     ("Mijn groepen", /?module=Profile&file=mygroups), seen live on
     2026-11-16; made-up groups and IDs. The list does not escape a name or a
     description: the bare & and " of the first group are as Smartschool
     sends them. -->
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Profiel - Smartschool</title>
</head>
<body>
<div id="smscMainBlockContainer">
	<div id="smscMainBlockContainerContent">
		<div class="smscSettings">
			<a class="smscSettings_backbutton" href="/?module=Profile"></a>
			<div class="smscSettings_mainTitle">Mijn groepen</div>
			<div>Stel uw eigen favoriete groepen samen</div>
		</div>
		<div>
			<div class="smsc-table mygroup-table">
<a href="/?module=Profile&file=mygroups&function=addedit" class="smsc-linkbutton smsc-linkbutton--icon smsc-linkbutton--add add-groups">Nieuwe groep</a>
	<div class="smsc-table__header">
		<div class="smsc-table__cell mygroup-icon"></div>
		<div class="smsc-table__cell mygroup-name">Naam</div>
		<div class="smsc-table__cell">Omschrijving</div>
		<div class="smsc-table__cell smsc-table__cell--text-right mygroup-actions"></div>
	</div>
<div class="smsc-table__row">
	<div class="smsc-table__cell mygroup-icon star-icon"></div>
	<div class="smsc-table__cell mygroup-name">Testgroep & "co"</div>
	<div class="smsc-table__cell">Testvak & "meer"</div>
	<div class="smsc-table__cell smsc-table__cell--text-right mygroup-actions">
		<a href="/?module=Profile&file=mygroups&function=addedit&mID=900503" class="edit" title='Wijzigen'></a>
		<a href="/?module=Profile&file=mygroups&function=users&mID=900503" class="add" title='Personen toevoegen'></a>
		<a onClick="confirmDelete('/?module=Profile&file=mygroups&function=delete&mID=900503');" class="delete" title='Verwijderen'></a>
	</div>
</div>
<div class="smsc-table__row">
	<div class="smsc-table__cell mygroup-icon star-icon"></div>
	<div class="smsc-table__cell mygroup-name">Testgroep 5</div>
	<div class="smsc-table__cell"></div>
	<div class="smsc-table__cell smsc-table__cell--text-right mygroup-actions">
		<a href="/?module=Profile&file=mygroups&function=addedit&mID=900501" class="edit" title='Wijzigen'></a>
		<a href="/?module=Profile&file=mygroups&function=users&mID=900501" class="add" title='Personen toevoegen'></a>
		<a onClick="confirmDelete('/?module=Profile&file=mygroups&function=delete&mID=900501');" class="delete" title='Verwijderen'></a>
	</div>
</div>
<div class="smsc-table__row">
	<div class="smsc-table__cell mygroup-icon star-icon"></div>
	<div class="smsc-table__cell mygroup-name">testgroep zorg</div>
	<div class="smsc-table__cell">Testvak 2B</div>
	<div class="smsc-table__cell smsc-table__cell--text-right mygroup-actions">
		<a href="/?module=Profile&file=mygroups&function=addedit&mID=900502" class="edit" title='Wijzigen'></a>
		<a href="/?module=Profile&file=mygroups&function=users&mID=900502" class="add" title='Personen toevoegen'></a>
		<a onClick="confirmDelete('/?module=Profile&file=mygroups&function=delete&mID=900502');" class="delete" title='Verwijderen'></a>
	</div>
</div>
</div>
		</div>
	</div>
</div>
</body>
</html>
